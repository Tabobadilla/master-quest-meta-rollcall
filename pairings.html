<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournex Tournament Pairings</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f5;color:#173d30;font-family:Arial,sans-serif}
.top{background:#073d2c;color:white;padding:20px}
.wrap{max-width:900px;margin:auto;padding:18px}
.brand{font-size:28px;font-weight:900}.sub{opacity:.86;margin-top:3px}
.card{background:white;border:1px solid #d7e4dd;border-radius:18px;padding:18px;margin:14px 0}
h2{margin:0 0 4px}.muted{color:#60766d}
.searchrow{display:flex;gap:8px;margin-top:14px}
.search{flex:1;padding:14px;border:1px solid #bfd4c9;border-radius:12px;font-size:17px}
.btn{border:0;border-radius:12px;background:#0f7a49;color:white;font-weight:900;padding:0 18px;cursor:pointer}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-top:16px}
.tab{white-space:nowrap;border:1px solid #bdd4c8;background:#eef5f1;color:#214b3b;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}
.tab.on{background:#0f7a49;color:white;border-color:#0f7a49}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:13px 10px;border-bottom:1px solid #dce7e1;text-align:left}
th{font-size:12px;color:#557064;text-transform:uppercase}
.tableNo{font-size:20px;font-weight:900}
.pairing-list{display:grid;gap:14px;margin-top:16px}
.pairing-card{border:1px solid #cfe0d7;border-radius:18px;background:#f8fbf9;padding:15px 16px;box-shadow:0 1px 0 rgba(8,54,39,.04)}
.pairing-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.table-bubble{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:999px;background:#dff0e7;color:#123f31;font-weight:900;font-size:15px;min-width:92px}
.round-label{font-size:12px;font-weight:900;color:#60766d}
.pairing-players{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.player-bubble{background:white;border:1px solid #dce9e2;border-radius:14px;padding:13px 14px;font-weight:900;font-size:17px;overflow-wrap:anywhere}
.player-bubble.right{text-align:right}
.player-line{display:flex;justify-content:space-between;align-items:center;gap:8px}.player-bubble.right .player-line{flex-direction:row}.record{color:#587267;font-size:14px;white-space:nowrap}.result-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.result-choice{padding:13px 6px;border:1px solid #bcd5c8;border-radius:12px;background:#eef5f1;color:#173d30;font-weight:900;cursor:pointer}.result-choice.selected{background:#0f7a49;color:white}.result-choice:disabled{opacity:.5}.result-submit{margin-top:9px;padding:13px;width:100%}.player-table-result .player-table-match{font-size:18px}
.vs{font-size:12px;font-weight:900;color:#6c8177;letter-spacing:.06em}
.pairing-card.bye .pairing-players{grid-template-columns:1fr}
.pairing-card.bye .player-bubble{text-align:center;background:#edf7f1}
.pairing-card.highlight{background:#e5f6eb;border-color:#75b793;box-shadow:0 0 0 2px rgba(15,122,73,.12)}
.highlight{background:#e9f8ef}
.player-table-result{margin-top:12px;border:2px solid #78b697;border-radius:20px;background:#e8f6ed;padding:18px;text-align:center}
.player-table-label{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#547064}
.player-table-number{font-size:76px;line-height:.95;font-weight:1000;color:#0f5d3d;margin:8px 0}
.player-table-match{font-size:18px;font-weight:900;color:#173e31}
.player-table-round{margin-top:7px;font-size:13px;font-weight:800;color:#60766d}
.final-player{display:flex;align-items:center;gap:9px}
.final-pokemon{width:38px;height:38px;object-fit:contain;flex:0 0 38px}
.hidden{display:none!important}
.bad{background:#fdeaea;padding:12px;border-radius:10px;color:#8a2e2e;margin-top:12px}
.good{background:#e5f6eb;padding:12px;border-radius:10px;color:#17613e;margin-top:12px}
@media(max-width:620px){
 .wrap{padding:10px}.card{padding:14px;border-radius:14px}
 .searchrow{display:block}.btn{width:100%;padding:13px;margin-top:8px}
 th,td{padding:11px 6px;font-size:14px}
 .brand{font-size:24px}
 .pairing-players{grid-template-columns:1fr}
 .player-bubble.right{text-align:left}
 .vs{text-align:center}
 .pairing-card{padding:13px}
}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="brand">Tournex</div><div class="sub">Tournament Pairings & Final Standings</div></div></div>

<div class="wrap">
  <div class="card">
    <h2 id="eventName">Tournament</h2>
    <div id="eventInfo" class="muted">Loading tournament…</div>

    <div class="searchrow">
      <input id="search" class="search" placeholder="Type your name to find your table faster…" autocomplete="off">
      <button id="searchBtn" class="btn">Search</button>
    </div>
    <div class="result-actions"><button class="result-choice" data-result="won">WON</button><button class="result-choice" data-result="lost">LOST</button><button class="result-choice" data-result="tie">TIE</button></div>
    <div id="resultMsg"></div>
    <div id="searchMsg"></div>

    <div id="tabs" class="tabs"></div>
  </div>

  <div class="card">
    <div id="sectionTitle"></div>
    <div id="content"></div>
  </div>
</div>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';

const sb=createClient(
  'https://njulnumhkxvtdfrjoigx.supabase.co',
  'sb_publishable_31ke9sSB-21M8MXDWZm1lA_p_sYct8Z'
);

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ordinal=n=>{n=Number(n);let s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
const SEARCH_KEY='tournex_saved_pairing_search';
const PLAYER_ID_KEY='tournex_v23_player_id';
const DEVICE_KEY='tournex_v23_device';
let selectedResult=null;let playerIdentity=null;let entryRecords=[];let reports=[];
const normalized=s=>String(s||'').trim().toLowerCase();
function deviceToken(){let v=localStorage.getItem(DEVICE_KEY);if(!v){v=crypto.randomUUID();localStorage.setItem(DEVICE_KEY,v)}return v;}
function reportMessage(m,ok=false){$('resultMsg').innerHTML='<div class="'+(ok?'good':'bad')+'">'+esc(m)+'</div>';}
function currentRound(){return activeView?.startsWith('round-')?Number(activeView.split('-')[1]):null;}
function myPairing(){return pairings.find(p=>Number(p.round_number)===currentRound()&&(normalized(p.player1_name)===normalized(playerIdentity?.player_name)||normalized(p.player2_name)===normalized(playerIdentity?.player_name)));}
function reportLockKey(){return 'tournex_v23_lock_'+tournament?.id+'_'+currentRound();}
function refreshReportLock(){const locked=localStorage.getItem(reportLockKey());document.querySelectorAll('[data-result]').forEach(b=>b.disabled=!!locked);if(locked)reportMessage('Result submitted on this browser for this round. Awaiting the other player.',true);}
function recordFor(name){const e=entryRecords.find(x=>normalized(x.player_name)===normalized(name));return e?`${e.wins||0}-${e.losses||0}-${e.ties||0}`:'0-0-0';}

function saveSearch(){const v=$('search').value.trim();if(v)localStorage.setItem(SEARCH_KEY,v);}
function restoreSearch(){const v=localStorage.getItem(SEARCH_KEY)||'';$('search').value=v;return v;}

const storeName=new URLSearchParams(location.search).get('store');
let tournament=null;
let pairings=[];
let standings=[];
let rounds=[];
let activeView=null;
let pokemonById={};

async function load(){
  if(!storeName){
    $('eventInfo').innerHTML='<div class="bad">This Store Pairings link is missing its store name. Open the link or QR shown inside Tournex.</div>';
    return;
  }

  const {data:t,error:te}=await sb.from('tournaments')
    .select('id,event_name,event_date,store_name,published_round,created_at')
    .eq('store_name',storeName)
    .eq('public_pairings_enabled',true)
    .order('created_at',{ascending:false})
    .limit(1)
    .maybeSingle();

  if(te){
    $('eventInfo').innerHTML='<div class="bad">Unable to load this tournament.</div>';
    return;
  }

  tournament=t;
  $('eventName').textContent=t.event_name||'Tournament';
  $('eventInfo').textContent=[t.store_name,t.event_date].filter(Boolean).join(' • ');

  const {data:p,error:pe}=await sb.from('pairings')
    .select('*').eq('tournament_id',t.id)
    .order('round_number').order('table_number');

  if(!pe) pairings=p||[];

  const {data:e,error:ee}=await sb.from('entries')
    .select('player_name,player_id,standing,wins,losses,ties,main_option_id,support_option_id')
    .eq('tournament_id',t.id)
    .not('standing','is',null)
    .order('standing');

  if(!ee) standings=e||[];
  const {data:allEntries}=await sb.from('entries').select('id,player_name,player_id,wins,losses,ties').eq('tournament_id',t.id);entryRecords=allEntries||[];

  // Deck/Pokémon information is used only for Final Standings.
  const pokemonIds=[...new Set(standings.flatMap(x=>[x.main_option_id,x.support_option_id]).filter(Boolean))];
  if(pokemonIds.length){
    const {data:o}=await sb.from('deck_options').select('id,name,sprite_url').in('id',pokemonIds);
    (o||[]).forEach(x=>pokemonById[String(x.id)]=x);
  }

  rounds=[...new Set(pairings.map(p=>Number(p.round_number)).filter(Boolean))].sort((a,b)=>a-b);
  buildTabs();

  activeView=rounds.length ? 'round-'+(t.published_round && rounds.includes(Number(t.published_round)) ? Number(t.published_round) : rounds[rounds.length-1]) : 'standings';
  render();
}

function buildTabs(){
  $('tabs').innerHTML =
    rounds.map(r=>`<button class="tab" data-view="round-${r}">Round ${r}</button>`).join('')+
    `<button class="tab" data-view="standings">Final Standings</button>`;

  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    activeView=b.dataset.view;
    $('searchMsg').innerHTML='';
    document.querySelectorAll('.highlight').forEach(r=>r.classList.remove('highlight'));
    render();
    if($('search').value.trim()) setTimeout(doSearch,0);
  });
}

function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===activeView));

  if(activeView==='standings'){
    $('sectionTitle').innerHTML='<h2>Final Standings</h2><div class="muted">Final tournament placement, match record, and Pokémon sprite.</div>';
    if(!standings.length){
      $('content').innerHTML='<div class="muted" style="margin-top:14px">Final standings have not been published yet.</div>';
      return;
    }
    $('content').innerHTML=`<table>
      <thead><tr><th>Standing</th><th>Player</th><th>Record</th></tr></thead>
      <tbody>${standings.map(e=>{const main=pokemonById[String(e.main_option_id)]||null,support=pokemonById[String(e.support_option_id)]||null;return `<tr data-player="${esc(e.player_name).toLowerCase()}">
        <td><b>${ordinal(e.standing)}</b></td>
        <td><div class="final-player">${main?.sprite_url?`<img class="final-pokemon" src="${esc(main.sprite_url)}" alt="">`:''}${support?.sprite_url?`<img class="final-pokemon" src="${esc(support.sprite_url)}" alt="">`:''}<div><b>${esc(e.player_name)}</b></div></div></td>
        <td>${Number(e.wins)||0}-${Number(e.losses)||0}-${Number(e.ties)||0}</td>
      </tr>`}).join('')}</tbody>
    </table>`;
    return;
  }

  const round=Number(activeView.split('-')[1]);
  const rows=pairings.filter(p=>Number(p.round_number)===round);
  $('sectionTitle').innerHTML=`<h2>Round ${round} Pairings</h2><div class="muted">${rows.length} pairing${rows.length===1?'':'s'} listed.</div>`;

  if(!rows.length){
    $('content').innerHTML='<div class="muted" style="margin-top:14px">Pairings for this round have not been published yet.</div>';
    return;
  }

  $('content').innerHTML=`<div class="pairing-list">${rows.map(p=>{
    const isBye=!p.player2_name || String(p.table_number||'').toUpperCase()==='BYE';
    return `<div class="pairing-card ${isBye?'bye':''}" data-p1="${esc(p.player1_name).toLowerCase()}" data-p2="${esc(p.player2_name||'').toLowerCase()}">
      <div class="pairing-card-head">
        <span class="table-bubble">${isBye?'BYE':'Table '+esc(p.table_number)}</span>
        <span class="round-label">Round ${round}</span>
      </div>
      ${isBye
        ? `<div class="pairing-players"><div class="player-bubble"><div class="player-line"><span>${esc(p.player1_name)}</span><span class="record">${recordFor(p.player1_name)}</span></div></div></div>`
        : `<div class="pairing-players"><div class="player-bubble"><div class="player-line"><span>${esc(p.player1_name)}</span><span class="record">${recordFor(p.player1_name)}</span></div></div><div class="vs">VS</div><div class="player-bubble right"><div class="player-line"><span>${esc(p.player2_name)}</span><span class="record">${recordFor(p.player2_name)}</span></div></div></div>`}
    </div>`;
  }).join('')}</div>`;
  refreshReportLock();
}

function clearSearch(){
  $('search').value='';
  $('searchMsg').innerHTML='';
  document.querySelectorAll('.highlight').forEach(r=>r.classList.remove('highlight'));
}

function doSearch(){
  const raw=$('search').value.trim();
  const q=raw.toLowerCase();
  document.querySelectorAll('.highlight').forEach(r=>r.classList.remove('highlight'));
  if(!q){$('searchMsg').innerHTML='';return;}
  saveSearch();
  const match=entryRecords.find(e=>e.player_id && String(e.player_id).trim()===raw);
  if(match){playerIdentity=match;localStorage.setItem(PLAYER_ID_KEY,raw);}

  if(activeView==='standings'){
    const row=[...document.querySelectorAll('tbody tr')].find(r=>(r.dataset.player||'').includes(q));
    if(!row){$('searchMsg').innerHTML='<div class="bad">Player not found in final standings.</div>';return;}
    row.classList.add('highlight');
    $('searchMsg').innerHTML='<div class="good">Player found. Their final standing is highlighted below.</div>';
    return;
  }

  const card=[...document.querySelectorAll('.pairing-card')].find(r=>(r.dataset.p1||'').includes(q)||(r.dataset.p2||'').includes(q)||(playerIdentity && ((r.dataset.p1||'')===normalized(playerIdentity.player_name)||(r.dataset.p2||'')===normalized(playerIdentity.player_name))));
  if(!card){$('searchMsg').innerHTML='<div class="bad">Player not found in this round.</div>';return;}
  card.classList.add('highlight');

  const tableText=card.querySelector('.table-bubble')?.textContent?.trim()||'Table';
  const isBye=tableText.toUpperCase()==='BYE';
  const tableNumber=isBye?'BYE':tableText.replace(/^Table\s*/i,'').trim();
  const players=[...card.querySelectorAll('.player-bubble')].map(x=>x.textContent.trim());
  const me=players.find(x=>x.toLowerCase().includes(q))||players[0]||raw;
  const opponent=players.find(x=>x!==me)||'BYE';

  $('searchMsg').innerHTML=`<div class="player-table-result">
    <div class="player-table-label">${isBye?'YOUR PAIRING':'YOUR TABLE'}</div>
    <div class="player-table-number">${esc(tableNumber)}</div>
    <div class="player-table-match">${esc(me)}${opponent==='BYE'?' — BYE':' vs. '+esc(opponent)}</div>
    <div class="player-table-round">Round ${esc(activeView.split('-')[1])}</div>
  </div>`;
}

$('searchBtn').onclick=doSearch;
$('search').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

document.querySelectorAll('[data-result]').forEach(b=>b.addEventListener('click',async()=>{
  const id=String($('search').value||'').trim();
  if(!/^\d+$/.test(id)){reportMessage('Enter your Pokémon Player ID in the search bar and press Search first.');return;}
  const e=entryRecords.find(x=>String(x.player_id||'').trim()===id);
  if(!e||!playerIdentity||e.id!==playerIdentity.id){reportMessage('Press Search to verify your Player ID first.');return;}
  if(!myPairing()){reportMessage('No pairing found for your Player ID in this round.');return;}
  if(localStorage.getItem(reportLockKey())){refreshReportLock();return;}
  selectedResult=b.dataset.result;
  document.querySelectorAll('[data-result]').forEach(x=>x.classList.toggle('selected',x===b));
  $('resultMsg').innerHTML='<button id="confirmResult" class="btn result-submit">Submit '+selectedResult.toUpperCase()+'</button>';
  $('confirmResult').onclick=async()=>{
    const pair=myPairing();if(!pair)return;
    const {data,error}=await sb.rpc('submit_pairing_result_v23',{p_pairing_id:pair.id,p_player_id:id,p_result:selectedResult,p_device_token:deviceToken()});
    if(error){reportMessage(error.message);return;}
    localStorage.setItem(reportLockKey(),id);
    refreshReportLock();
    if(data?.status==='confirmed')reportMessage('Both reports agree. Match confirmed.',true);
  };
}));
const remembered=localStorage.getItem(PLAYER_ID_KEY)||restoreSearch();
await load();
if(remembered && activeView!=='standings'){$('search').value=remembered;setTimeout(doSearch,50);}
</script>
</body>
</html>
