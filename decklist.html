<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#063b2b">
  <title>Tournex — Decklist Review</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#f3f6f4;--card:#fff;--ink:#143326;--muted:#667a70;--green:#0f7a49;--green2:#063b2b;--line:#d8e4dc;--good-bg:#e4f4e9;--good:#17653c;--warn-bg:#fff3cd;--warn:#735c00;--bad-bg:#fde7e7;--bad:#8e2f2f}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .top{background:var(--green2);color:#fff;padding:18px 20px}
    .brand{font-size:22px;font-weight:900}
    .sub{font-size:13px;opacity:.85;margin-top:3px}
    .wrap{max-width:900px;margin:0 auto;padding:16px}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
    .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .muted{color:var(--muted);font-size:13px;line-height:1.45}
    .meta{font-size:14px;margin-top:7px;line-height:1.6}
    .btn{border:0;border-radius:10px;background:var(--green);color:#fff;min-height:42px;font-weight:850;padding:9px 14px;cursor:pointer}
    .btn.alt{background:#e8f0eb;color:#244c3a}
    .btn:disabled{opacity:.55}
    .status{border-radius:10px;padding:10px 12px;margin:12px 0;font-weight:800}
    .good{background:var(--good-bg);color:var(--good)}
    .warn{background:var(--warn-bg);color:var(--warn)}
    .bad{background:var(--bad-bg);color:var(--bad)}
    pre{white-space:pre-wrap;background:#f5f7f6;border:1px solid #dce7e0;border-radius:12px;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5}
    .hidden{display:none!important}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    @media(max-width:620px){.wrap{padding:10px}.card{padding:15px}.head{flex-direction:column}}
    @media print{.top,.actions,.back{display:none!important}body{background:#fff}.wrap{max-width:none;padding:0}.card{border:0}}
  </style>

<style id="tournex-theme-styles">
html[data-tournex-theme="dark"]{
 color-scheme:dark;
 --bg:#080f0d;--card:#111d18;--ink:#eefbf1;--muted:#a3b8ab;
 --green:#7bed4b;--green2:#09160f;--lime:#a9fa52;--line:#31503a;--danger:#ff7777;
}
html[data-tournex-theme="dark"] body{background:#080f0d!important;color:#eefbf1!important}
html[data-tournex-theme="dark"] .top,
html[data-tournex-theme="dark"] header{background:#07140d!important;color:#f1fff4!important}
html[data-tournex-theme="dark"] .card,
html[data-tournex-theme="dark"] .round-workspace,
html[data-tournex-theme="dark"] .pairing-card,
html[data-tournex-theme="dark"] .pairing-player,
html[data-tournex-theme="dark"] .player-search-box,
html[data-tournex-theme="dark"] .added-player-search,
html[data-tournex-theme="dark"] .player-search-prominent,
html[data-tournex-theme="dark"] .tdf-import-card,
html[data-tournex-theme="dark"] .store-pairings-share,
html[data-tournex-theme="dark"] .public-link-box,
html[data-tournex-theme="dark"] #editPlayerBox,
html[data-tournex-theme="dark"] .store-public-url,
html[data-tournex-theme="dark"] .mq-picker-btn,
html[data-tournex-theme="dark"] .modal-content,
html[data-tournex-theme="dark"] [class*="modal-box"]{
 background:#111d18!important;color:#eefbf1!important;border-color:#31503a!important;
}
html[data-tournex-theme="dark"] input,
html[data-tournex-theme="dark"] select,
html[data-tournex-theme="dark"] textarea{
 background:#14251c!important;color:#f1fff4!important;border-color:#416249!important;
}
html[data-tournex-theme="dark"] input::placeholder,
html[data-tournex-theme="dark"] textarea::placeholder{color:#9eb1a3!important}
html[data-tournex-theme="dark"] label,
html[data-tournex-theme="dark"] .muted,
html[data-tournex-theme="dark"] .deck,
html[data-tournex-theme="dark"] .pairing-round-label,
html[data-tournex-theme="dark"] .pairing-vs,
html[data-tournex-theme="dark"] .player-search-title,
html[data-tournex-theme="dark"] .added-players-head h3,
html[data-tournex-theme="dark"] .store-public-url{color:#bbd3c2!important}
html[data-tournex-theme="dark"] .tabs button:not(.on),
html[data-tournex-theme="dark"] .btn.alt,
html[data-tournex-theme="dark"] .round-btn:not(.on),
html[data-tournex-theme="dark"] .player-search-clear{
 background:#23372a!important;color:#e4f8e7!important;border-color:#476448!important
}
html[data-tournex-theme="dark"] .btn:not(.danger),
html[data-tournex-theme="dark"] .tabs button.on,
html[data-tournex-theme="dark"] .round-btn.on{background:#92ef51;color:#0b190d}
html[data-tournex-theme="dark"] .msg.good{background:#173d26!important;color:#aaff9a!important}
html[data-tournex-theme="dark"] .msg.bad{background:#4a1b20!important;color:#ffb5b5!important}
html[data-tournex-theme="dark"] .msg:not(.good):not(.bad){background:#453716!important;color:#ffe5a1!important}
html[data-tournex-theme="dark"] .pill,
html[data-tournex-theme="dark"] .pairing-table-pill{background:#26482d!important;color:#adff81!important}
#tournex-theme-switch{position:fixed;right:14px;bottom:14px;z-index:99990;
 border:1px solid #64a875;border-radius:999px;padding:11px 15px;cursor:pointer;
 background:#0c2216;color:#c5ff9b;font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 box-shadow:0 5px 24px #0005}
html[data-tournex-theme="light"] #tournex-theme-switch{background:#fff;color:#175b34;border-color:#b4d7c0}
</style>

<script id="tournex-theme-control">
(function(){
 const KEY='tournex-theme';
 function apply(mode){
   document.documentElement.dataset.tournexTheme=mode;
   try{localStorage.setItem(KEY,mode)}catch(e){}
   const btn=document.getElementById('tournex-theme-switch');
   if(btn){btn.textContent=mode==='dark'?'☀ Light Mode':'☾ Dark Mode';btn.setAttribute('aria-label','Switch to '+(mode==='dark'?'light':'dark')+' mode')}
 }
 let saved='light';try{saved=localStorage.getItem(KEY)||'light'}catch(e){}
 apply(saved==='dark'?'dark':'light');
 document.addEventListener('DOMContentLoaded',()=>{
   const btn=document.createElement('button');btn.id='tournex-theme-switch';btn.type='button';
   btn.onclick=()=>apply(document.documentElement.dataset.tournexTheme==='dark'?'light':'dark');
   document.body.appendChild(btn);apply(document.documentElement.dataset.tournexTheme);
 });
 window.addEventListener('storage',e=>{if(e.key===KEY)apply(e.newValue==='dark'?'dark':'light')});
})();
</script>
</head>
<body>
  <header class="top">
    <div class="brand">TOURNEX</div>
    <div class="sub">Professor Decklist Review</div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="head">
        <div>
          <h2 id="title" style="margin:0">Loading Decklist…</h2>
          <div id="meta" class="meta muted"></div>
        </div>
        <button class="btn alt back" id="backBtn">Back</button>
      </div>

      <div id="msg"></div>
      <div id="status"></div>
      <pre id="deckText">Loading…</pre>

      <div class="actions">
        <button class="btn" id="printBtn">Print Decklist</button>
        <button class="btn alt" id="verifyBtn">Mark Verified</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL='https://njulnumhkxvtdfrjoigx.supabase.co';
    const SUPABASE_KEY='sb_publishable_31ke9sSB-21M8MXDWZm1lA_p_sYct8Z';
    const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
    const $=id=>document.getElementById(id);

    let submission=null;

    function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

    function showError(text){
      $('msg').innerHTML='<div class="status bad">'+esc(text)+'</div>';
      $('deckText').textContent='';
    }

    async function load(){
      const {data:{session}}=await sb.auth.getSession();
      if(!session){
        showError('Professor/Organizer sign-in is required to view this decklist.');
        $('verifyBtn').disabled=true;
        $('printBtn').disabled=true;
        return;
      }

      const params=new URLSearchParams(location.search);
      const submissionId=params.get('submission');
      const entryId=params.get('entry');

      let data=null,error=null;

      if(submissionId){
        ({data,error}=await sb.from('decklist_submissions').select('*').eq('id',submissionId).single());
      }else if(entryId){
        const res=await sb.from('decklist_submissions').select('*').eq('linked_entry_id',entryId).order('submitted_at',{ascending:false}).limit(1);
        error=res.error;
        data=(res.data||[])[0]||null;
      }else{
        return showError('No decklist was specified.');
      }

      if(error) return showError(error.message);
      if(!data) return showError('No digital decklist was found for this player.');

      submission=data;
      const dob=data.birthdate ? new Date(data.birthdate+'T00:00:00').toLocaleDateString('en-US') : '—';

      $('title').textContent=data.trainer_name+' — Decklist';
      $('meta').textContent=
        (data.player_id?'Player ID '+data.player_id+' • ':'')+
        (data.division||'')+' • DOB '+dob+' • '+(data.format||'Standard');

      if(data.professor_status==='verified'){
        $('status').innerHTML='<div class="status good">✓ Professor Verified • '+(data.card_total??'Unknown')+'/60 cards</div>';
        $('verifyBtn').textContent='Verified';
        $('verifyBtn').disabled=true;
      }else if(data.card_total===60){
        $('status').innerHTML='<div class="status good">60/60 cards — Ready for Professor Review</div>';
      }else{
        $('status').innerHTML='<div class="status warn">'+(data.card_total??'Unknown')+'/60 cards — Review required</div>';
      }

      $('deckText').textContent=data.decklist_text||'';
    }

    async function verify(){
      if(!submission) return;
      const {error}=await sb.from('decklist_submissions').update({professor_status:'verified'}).eq('id',submission.id);
      if(error) return showError(error.message);

      const {error:entryError}=await sb.from('entries').update({decklist_verified:true}).eq('id',submission.linked_entry_id);
      if(entryError) return showError(entryError.message);

      submission.professor_status='verified';
      $('status').innerHTML='<div class="status good">✓ Professor Verified • '+(submission.card_total??'Unknown')+'/60 cards</div>';
      $('verifyBtn').textContent='Verified';
      $('verifyBtn').disabled=true;
    }

    $('backBtn').onclick=()=>history.back();
    $('printBtn').onclick=()=>window.print();
    $('verifyBtn').onclick=verify;

    load();
  </script>

<script id="tournex-background-refresh">
(function(){
 let busy=false;
 async function tick(){
   if(busy||document.hidden||!navigator.onLine)return;
   const active=document.activeElement;
   if(active&&/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName))return;
   busy=true;
   try{
     if(typeof refreshMatchStatus==='function')await refreshMatchStatus();
     if(typeof refreshPublicTimer==='function')await refreshPublicTimer();
     if(typeof load==='function'&&location.pathname.endsWith('/pairings.html'))await load();
     if(typeof loadEntries==='function'&&typeof currentTournament!=='undefined'&&currentTournament)await loadEntries();
     if(typeof loadJudgeTimer==='function'&&document.querySelector('#judgeTimer'))await loadJudgeTimer();
   }catch(e){console.warn('Tournex background update:',e)}
   finally{busy=false}
 }
 setInterval(tick,15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
})();
</script>
</body>
</html>
