<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073d2c"><title>Tournex · Live Round Timer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071c16;color:#f6fff9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;display:grid;place-items:center;padding:20px}.panel{width:min(100%,760px);text-align:center}.brand{font-size:14px;letter-spacing:.23em;color:#9bcdb3;font-weight:800}.event{font-size:clamp(18px,4vw,30px);margin:15px 0 4px}.store{color:#9bb6a8}.clock{font-size:clamp(84px,19vw,190px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.075em;line-height:1.2;margin:20px 0}.clock.low{color:#ffd276}.clock.overtime{color:#ff7e7e}.status{font-size:20px;font-weight:700}.note{color:#a7bfb3;font-size:13px;margin:12px 0 24px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button,a.action{appearance:none;border:1px solid #4c8c70;border-radius:12px;background:#164b35;color:white;padding:13px 18px;font:600 15px system-ui;text-decoration:none;cursor:pointer}button:disabled{opacity:.45}.hint{font-size:13px;color:#a7bfb3;margin-top:22px}body.fullscreen .hint{display:none}
</style></head><body><main class="panel"><div class="brand">MASTER QUEST · TOURNEX</div><h1 class="event" id="event">Live Round Timer</h1><div class="store" id="store">Connecting…</div><div class="clock" id="clock" role="timer" aria-label="Round countdown">--:--</div><div class="status" id="status">Loading…</div><div class="note" id="sync">Synchronizes with the tournament's Professor timer.</div><div class="actions"><button id="fullscreen">Fullscreen</button><button id="sound">Enable sound</button><button id="share">Copy link</button><a class="action" id="pairings" href="pairings.html">Pairings</a></div><p class="hint">Keep this page open to view the live countdown. Screen wake lock works where supported. Timer controls remain in Tournex Judge Tools.</p></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://njulnumhkxvtdfrjoigx.supabase.co','sb_publishable_31ke9sSB-21M8MXDWZm1lA_p_sYct8Z');
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),store=params.get('store');
let tournament=null,state=null,busy=false,offset=0,lastSeconds=null,soundEnabled=false,audio=null,wake=null;
function format(n){n=Math.floor(n);const sign=n<0?'−':'';n=Math.abs(n);return sign+String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function seconds(){if(!state)return null;let n=Number(state.remaining_seconds)||0;if(state.status==='running'&&state.started_at)n-=Math.floor((Date.now()+offset-new Date(state.started_at).getTime())/1000);return n}
function beep(){if(!soundEnabled)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=740;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.4)}catch(e){}}
function render(){const n=seconds(),el=$('clock');el.textContent=n===null?'--:--':format(n);el.classList.toggle('low',n!==null&&n>=0&&n<=300);el.classList.toggle('overtime',n!==null&&n<0);$('status').textContent=!state?'Waiting for timer':state.status==='running'?(n<0?'Overtime':'Round in progress'):state.status==='paused'?'Paused':'Stopped';if(lastSeconds!==null&&lastSeconds>0&&n!==null&&n<=0)beep();lastSeconds=n}
async function sync(){if(!tournament||busy)return;busy=true;try{const before=Date.now();const {data,error}=await sb.rpc('public_round_timer_v23',{p_tournament_id:tournament.id});const after=Date.now();if(error)throw error;state=data;const serverTime=data?.server_time||data?.server_now;if(serverTime)offset=new Date(serverTime).getTime()-(before+after)/2;render();$('sync').textContent='Shared countdown · Last synced '+new Date().toLocaleTimeString()}catch(e){$('sync').textContent='Connection interrupted · Retrying…';console.warn(e)}finally{busy=false}}
async function init(){if(!store){$('store').textContent='Missing store name. Open this timer from your tournament page.';return}const {data,error}=await sb.from('tournaments').select('id,event_name,store_name').eq('store_name',store).eq('public_pairings_enabled',true).order('created_at',{ascending:false}).limit(1).maybeSingle();if(error||!data){$('store').textContent='No published tournament found for this store.';return}tournament=data;$('event').textContent=data.event_name||'Tournament';$('store').textContent=data.store_name;$('pairings').href='pairings.html?store='+encodeURIComponent(store);await sync();sb.channel('public-timer-'+data.id).on('postgres_changes',{event:'*',schema:'public',table:'judge_timers',filter:'tournament_id=eq.'+data.id},sync).subscribe()}
async function keepAwake(){try{if('wakeLock' in navigator&&!document.hidden)wake=await navigator.wakeLock.request('screen')}catch(e){}}
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen()}}catch(e){}await keepAwake()};
$('sound').onclick=()=>{soundEnabled=!soundEnabled;$('sound').textContent=soundEnabled?'Sound enabled':'Enable sound';if(soundEnabled){beep();keepAwake()}};
$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('share').textContent='Copied!';setTimeout(()=>$('share').textContent='Copy link',2000)}catch(e){prompt('Copy timer link:',location.href)}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){sync();keepAwake()}});setInterval(render,250);setInterval(sync,5000);init();
</script></body></html>
