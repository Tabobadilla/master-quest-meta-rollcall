<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournex — Decklist Review</title>
<style>
:root{--green:#123f2e;--line:#d8e3dd;--bg:#f3f7f4;--card:#fff;--muted:#667a70}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#18352a}
.wrap{max-width:900px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
h1{margin:0}.muted{color:var(--muted);font-size:13px}.meta{margin-top:8px;line-height:1.7}
pre{white-space:pre-wrap;background:#f7faf8;border:1px solid var(--line);border-radius:12px;padding:16px;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#e7efe9;color:#174632}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.good{padding:10px;border-radius:10px;background:#e8f7ee;color:#17633b;font-weight:800}.warn{padding:10px;border-radius:10px;background:#fff4d9;color:#795b0a;font-weight:800}.bad{padding:10px;border-radius:10px;background:#fde8e8;color:#8a2525;font-weight:800}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1 id="title">Decklist Review</h1>
  <div id="meta" class="meta muted">Loading submitted decklist…</div>
  <div id="status" style="margin-top:12px"></div>
  <pre id="deck">Loading…</pre>
  <div class="actions">
    <button id="printBtn" class="btn">Print Decklist</button>
    <button id="verifyBtn" class="btn alt">Mark Verified</button>
    <button id="closeBtn" class="btn alt">Close</button>
  </div>
</div></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://njulnumhkxvtdfrjoigx.supabase.co';
const SUPABASE_KEY='sb_publishable_31ke9sSB-21M8MXDWZm1lA_p_sYct8Z';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const entryId=new URLSearchParams(location.search).get('entry');
let submission=null;

function fail(msg){ $('meta').textContent=''; $('status').innerHTML='<div class="bad">'+String(msg)+'</div>'; $('deck').textContent=''; }
async function load(){
  if(!entryId) return fail('No player entry was supplied.');
  const {data:entry,error:e1}=await sb.from('entries').select('id,player_name,player_id,division,source_submission_id,main_option_id,support_option_id').eq('id',entryId).single();
  if(e1) return fail(e1.message);
  let q=sb.from('decklist_submissions').select('*');
  if(entry.source_submission_id) q=q.eq('id',entry.source_submission_id);
  else q=q.eq('linked_entry_id',entryId).order('updated_at',{ascending:false}).limit(1);
  const {data,error}=await q;
  if(error) return fail(error.message);
  submission=Array.isArray(data)?data[0]:data;
  if(!submission) return fail('No submitted digital decklist was found for this player.');

  const ids=[submission.parsed_main_option_id,submission.parsed_support_option_id].filter(Boolean);
  let opts=[];
  if(ids.length){ const r=await sb.from('deck_options').select('id,name').in('id',ids); opts=r.data||[]; }
  const name=id=>opts.find(o=>o.id===id)?.name||'—';
  const year=submission.birthdate?String(submission.birthdate).slice(0,4):'—';
  const rev=Number(submission.revision_number||1);

  $('title').textContent=(submission.trainer_name||entry.player_name)+' — Submitted Decklist';
  $('meta').textContent=
    (submission.player_id?'Player ID '+submission.player_id+' • ':'')+
    (submission.division||entry.division||'')+' • Birth Year '+year+
    ' • Standard • Revision '+rev+(submission.is_replacement?' • Replacement':'')+
    ' • Main: '+name(submission.parsed_main_option_id)+
    ' • Support: '+name(submission.parsed_support_option_id);
  $('status').innerHTML=submission.professor_status==='verified'
    ? '<div class="good">✓ Professor Verified • '+(submission.card_total??'?')+'/60 cards</div>'
    : (Number(submission.card_total)===60?'<div class="good">60/60 cards</div>':'<div class="warn">'+(submission.card_total??'?')+'/60 cards — Review required</div>');
  $('deck').textContent=submission.decklist_text||'';
  $('verifyBtn').disabled=submission.professor_status==='verified';
  $('verifyBtn').textContent=submission.professor_status==='verified'?'Verified':'Mark Verified';
}
$('printBtn').onclick=()=>window.print();
$('closeBtn').onclick=()=>window.close();
$('verifyBtn').onclick=async()=>{
  if(!submission) return;
  const {error}=await sb.from('decklist_submissions').update({professor_status:'verified'}).eq('id',submission.id);
  if(error) return alert(error.message);
  if(submission.linked_entry_id){
    await sb.from('entries').update({decklist_verified:true}).eq('id',submission.linked_entry_id);
  }
  submission.professor_status='verified';
  $('status').innerHTML='<div class="good">✓ Professor Verified • '+(submission.card_total??'?')+'/60 cards</div>';
  $('verifyBtn').disabled=true; $('verifyBtn').textContent='Verified';
};
load();
</script>
</body>
</html>
