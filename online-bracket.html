<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournex · Online Bracket</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#ecf7f1;background:#081e18}body{margin:0}main{max-width:1100px;margin:auto;padding:26px 18px}h1{font-size:clamp(27px,5vw,40px)}.muted{color:#a9c3b6}.card{background:#102e24;border:1px solid #2c5946;border-radius:15px;padding:18px;margin:14px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.round{flex:1;min-width:240px}.match{border:1px solid #44725c;border-radius:10px;padding:12px;margin:10px 0}.player{display:flex;align-items:center;gap:9px;padding:9px;border-radius:7px}.winner{background:#175c39}.sprite{width:30px;height:30px;object-fit:contain}.pill{display:inline-block;border-radius:16px;background:#29513e;padding:5px 10px}.error{color:#ffb0b0}a{color:#8fe4b8}.canvas-scroll{overflow-x:auto}.canvas{position:relative;width:1450px;height:1050px;background:#0c281e;border:1px solid #355c48;border-radius:14px}.node{position:absolute;width:200px;box-sizing:border-box;padding:8px;background:#153a2b;border:1px solid #608c70;border-radius:8px;z-index:2;font-size:12px}.node.future{border-style:dashed;opacity:.8}.node .heading{color:#e8c777;font-weight:bold;margin-bottom:5px}.node .line{padding:5px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node .won{background:#1e6845}.canvas svg{position:absolute;inset:0;z-index:1}.canvas path{fill:none;stroke:#7da58b;stroke-width:2}.canvas .label{position:absolute;font-size:20px;color:#e8c777;font-weight:bold}.note{color:#a9c3b6;font-size:13px}</style></head><body><main><a href="./">← Master Quest Tournex</a><h1 id="title">Online Tournament Bracket</h1><p id="meta" class="muted">Loading event…</p><div id="status" class="card">Fetching public bracket…</div><section id="bracket"></section><section class="card"><h2>Decklist privacy</h2><p class="muted">Decklists are not published on this public bracket. Access to a current opponent's decklist will be available through a separate verified player match view when that feature is enabled.</p></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://njulnumhkxvtdfrjoigx.supabase.co','sb_publishable_31ke9sSB-21M8MXDWZm1lA_p_sYct8Z');
const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('event');
const element=(tag,cls,content)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=String(content);return e};
function playerRow(id,players,winner){const p=players.find(x=>x.id===id);const row=element('div','player'+(winner&&winner===id?' winner':''));if(p?.sprite_url&&/^https:\/\//.test(p.sprite_url)){const img=element('img','sprite');img.src=p.sprite_url;img.alt='';img.referrerPolicy='no-referrer';row.append(img)}row.append(element('span','',p?.name||'BYE / TBD'));if(winner===id)row.append(element('strong','','✓ Winner'));return row}
async function load(){if(!id||!/^[0-9a-f-]{36}$/i.test(id))throw Error('Open a valid tournament bracket link.');const {data,error}=await sb.rpc('online_public_bracket',{p_event_id:id});if(error)throw error;if(!data?.event)throw Error('Event not found or unavailable.');$('title').textContent=data.event.name;$('meta').textContent=new Date(data.event.starts_at).toLocaleString()+' · '+data.event.status.toUpperCase()+' · '+data.event.round_minutes+' minute rounds';const players=data.players||[],matches=data.matches||[];$('status').textContent=players.length+' registered players · '+matches.length+' bracket matches';const board=$('bracket');board.replaceChildren();if(!matches.length){board.append(element('div','card','No pairings published yet. The bracket below shows the planned structure; player names will populate after pairing.'))}const wrap=element('div','canvas-scroll'),canvas=element('div','canvas');wrap.append(canvas);board.append(element('p','note','Connected double-elimination bracket · Dashed matches are future placeholders · Scroll right for the finals'));board.append(wrap);
const labels=[['WINNERS BRACKET',20,10],['LOSERS BRACKET',20,625],['GRAND FINAL',1200,365]];
for(const [t,x,y] of labels){const el=element('div','label',t);el.style.left=x+'px';el.style.top=y+'px';canvas.append(el)}
const layout=[[1,'winners',1,20,170],[2,'winners',1,20,380],[3,'winners',2,260,70],[4,'winners',2,260,490],[5,'winners',2,260,210],[6,'winners',2,260,350],[7,'losers',1,260,690],[8,'losers',1,260,870],[9,'losers',2,500,690],[10,'losers',2,500,870],[11,'winners',3,500,140],[12,'winners',3,500,420],[13,'losers',3,740,690],[14,'losers',3,740,870],[15,'winners',4,740,280],[16,'losers',4,980,780],[17,'losers',5,980,600],[18,'final',1,980,280],[19,'final',2,1220,420]];
const nodes={};for(const [n,br,round,x,y] of layout){nodes[n]={x,y};const previous=layout.filter(v=>v[1]===br&&v[2]===round&&v[0]<n).length;const matching=matches.filter(m=>m.bracket===br&&m.round_number===round).sort((a,b)=>a.match_number-b.match_number);const m=matching[previous];const el=element('div','node'+(m?'':' future'));el.style.left=x+'px';el.style.top=y+'px';el.append(element('div','heading','Match '+n+(m?' · Table '+(m.table_number||m.match_number):' · Upcoming')));for(const pid of [m?.player1_id,m?.player2_id]){const p=players.find(v=>v.id===pid);el.append(element('div','line'+(pid&&m?.winner_id===pid?' won':''),p?.name||(m&&pid===null?'BYE':'TBD')))}canvas.append(el)}
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width','1450');svg.setAttribute('height','1050');const edges=[[1,5],[2,6],[3,11],[5,11],[6,12],[4,12],[11,15],[12,15],[7,9],[8,10],[9,13],[10,14],[13,16],[14,16],[16,17],[15,18],[17,18],[18,19]];for(const [a,b] of edges){const A=nodes[a],B=nodes[b],x=A.x+200,y=A.y+40,z=B.x,w=B.y+40,mid=(x+z)/2;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M'+x+' '+y+' H'+mid+' V'+w+' H'+z);svg.append(path)}canvas.prepend(svg);
}
load().catch(e=>{$('status').textContent=e.message;$('status').classList.add('error')});
</script></body></html>
