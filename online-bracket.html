<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournex · Online Bracket</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#ecf7f1;background:#081e18}body{margin:0}main{max-width:1100px;margin:auto;padding:26px 18px}h1{font-size:clamp(27px,5vw,40px)}.muted{color:#a9c3b6}.card{background:#102e24;border:1px solid #2c5946;border-radius:15px;padding:18px;margin:14px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.round{flex:1;min-width:240px}.match{border:1px solid #44725c;border-radius:10px;padding:12px;margin:10px 0}.player{display:flex;align-items:center;gap:9px;padding:9px;border-radius:7px}.winner{background:#175c39}.sprite{width:30px;height:30px;object-fit:contain}.pill{display:inline-block;border-radius:16px;background:#29513e;padding:5px 10px}.error{color:#ffb0b0}a{color:#8fe4b8}</style></head><body><main><a href="./">← Master Quest Tournex</a><h1 id="title">Online Tournament Bracket</h1><p id="meta" class="muted">Loading event…</p><div id="status" class="card">Fetching public bracket…</div><section id="bracket"></section><section class="card"><h2>Decklist privacy</h2><p class="muted">Decklists are not published on this public bracket. Access to a current opponent's decklist will be available through a separate verified player match view when that feature is enabled.</p></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://njulnumhkxvtdfrjoigx.supabase.co','sb_publishable_31ke9sSB-21M8MXDWZm1lA_p_sYct8Z');
const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('event');
const element=(tag,cls,content)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=String(content);return e};
function playerRow(id,players,winner){const p=players.find(x=>x.id===id);const row=element('div','player'+(winner&&winner===id?' winner':''));if(p?.sprite_url&&/^https:\/\//.test(p.sprite_url)){const img=element('img','sprite');img.src=p.sprite_url;img.alt='';img.referrerPolicy='no-referrer';row.append(img)}row.append(element('span','',p?.name||'BYE / TBD'));if(winner===id)row.append(element('strong','','✓ Winner'));return row}
async function load(){if(!id||!/^[0-9a-f-]{36}$/i.test(id))throw Error('Open a valid tournament bracket link.');const {data,error}=await sb.rpc('online_public_bracket',{p_event_id:id});if(error)throw error;if(!data?.event)throw Error('Event not found or unavailable.');$('title').textContent=data.event.name;$('meta').textContent=new Date(data.event.starts_at).toLocaleString()+' · '+data.event.status.toUpperCase()+' · '+data.event.round_minutes+' minute rounds';const players=data.players||[],matches=data.matches||[];$('status').textContent=players.length+' registered players · '+matches.length+' bracket matches';const board=$('bracket');board.replaceChildren();if(!matches.length){board.append(element('div','card','Pairings have not been published yet.'));return}const groups=new Map();for(const m of matches){const k=m.bracket+' / Round '+m.round_number;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(m)}const wrap=element('div','row');for(const [label,items] of groups){const col=element('div','round card');col.append(element('h2','',label));for(const m of items){const box=element('div','match');box.append(element('div','muted','Match '+m.match_number));box.append(playerRow(m.player1_id,players,m.winner_id));box.append(playerRow(m.player2_id,players,m.winner_id));col.append(box)}wrap.append(col)}board.append(wrap)}
load().catch(e=>{$('status').textContent=e.message;$('status').classList.add('error')});
</script></body></html>
