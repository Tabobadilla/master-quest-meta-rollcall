<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournex · Simultaneous Start Bracket</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#ecf7f1;background:#081e18}body{margin:0}main{max-width:1100px;margin:auto;padding:26px 18px}h1{font-size:clamp(27px,5vw,40px)}.muted{color:#a9c3b6}.card{background:#102e24;border:1px solid #2c5946;border-radius:15px;padding:18px;margin:14px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.round{flex:1;min-width:240px}.match{border:1px solid #44725c;border-radius:10px;padding:12px;margin:10px 0}.player{display:flex;align-items:center;gap:9px;padding:9px;border-radius:7px}.winner{background:#175c39}.sprite{width:30px;height:30px;object-fit:contain}.pill{display:inline-block;border-radius:16px;background:#29513e;padding:5px 10px}.error{color:#ffb0b0}a{color:#8fe4b8}.canvas-scroll{overflow-x:auto}.canvas{position:relative;width:1450px;height:1050px;background:#0c281e;border:1px solid #355c48;border-radius:14px}.node{position:absolute;width:200px;box-sizing:border-box;padding:8px;background:#153a2b;border:1px solid #608c70;border-radius:8px;z-index:2;font-size:12px}.node.future{border-style:dashed;opacity:.8}.node .heading{color:#e8c777;font-weight:bold;margin-bottom:5px}.node .line{padding:5px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node .won{background:#1e6845}.canvas svg{position:absolute;inset:0;z-index:1}.canvas path{fill:none;stroke:#7da58b;stroke-width:2}.canvas .label{position:absolute;font-size:20px;color:#e8c777;font-weight:bold}.note{color:#a9c3b6;font-size:13px}</style></head><body><main><a href="./">← Master Quest Tournex</a><h1 id="title">Online Tournament Bracket</h1><p id="meta" class="muted">Loading event…</p><div id="status" class="card">Fetching public bracket…</div><section id="bracket"></section><section class="card"><h2>Decklist privacy</h2><p class="muted">Decklists are not published on this public bracket. Access to a current opponent's decklist will be available through a separate verified player match view when that feature is enabled.</p></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://njulnumhkxvtdfrjoigx.supabase.co','sb_publishable_31ke9sSB-21M8MXDWZm1lA_p_sYct8Z');
const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('event');
const element=(tag,cls,content)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=String(content);return e};
function playerRow(id,players,winner){const p=players.find(x=>x.id===id);const row=element('div','player'+(winner&&winner===id?' winner':''));if(p?.sprite_url&&/^https:\/\//.test(p.sprite_url)){const img=element('img','sprite');img.src=p.sprite_url;img.alt='';img.referrerPolicy='no-referrer';row.append(img)}row.append(element('span','',p?.name||'BYE / TBD'));if(winner===id)row.append(element('strong','','✓ Winner'));return row}
async function load(){if(!id||!/^[0-9a-f-]{36}$/i.test(id))throw Error('Open a valid tournament bracket link.');const {data,error}=await sb.rpc('online_public_bracket',{p_event_id:id});if(error)throw error;if(!data?.event)throw Error('Event not found or unavailable.');$('title').textContent=data.event.name;$('meta').textContent=new Date(data.event.starts_at).toLocaleString()+' · '+data.event.status.toUpperCase()+' · '+data.event.round_minutes+' minute rounds';const players=data.players||[],matches=data.matches||[];$('status').textContent=players.length+' registered players · '+matches.length+' bracket matches';const board=$('bracket');board.replaceChildren();if(!matches.length){board.append(element('div','card','No pairings published yet. The bracket below shows the planned structure; player names will populate after pairing.'))}const wrap=element('div','canvas-scroll'),canvas=element('div','canvas');wrap.append(canvas);board.append(element('p','note','All 10 players start together: five Round 1 matches, five Discord tables, no first-round byes. Future rounds are provisional until results are confirmed.'));board.append(wrap);
const headings=[['WINNERS BRACKET',20,10],['LOSERS BRACKET',20,610],['GRAND FINAL',1190,365]];for(const [label,x,y] of headings){const el=element('div','label',label);el.style.left=x+'px';el.style.top=y+'px';canvas.append(el)}
const slots=[
['winners',1,1,20,85],['winners',1,2,20,180],['winners',1,3,20,275],['winners',1,4,20,370],['winners',1,5,20,465],
['winners',2,1,275,130],['winners',2,2,275,280],['winners',2,3,275,430],
['winners',3,1,530,190],['winners',3,2,530,385],['winners',4,1,785,290],
['losers',1,1,20,680],['losers',1,2,20,800],['losers',1,3,20,920],
['losers',2,1,275,680],['losers',2,2,275,800],['losers',2,3,275,920],
['losers',3,1,530,700],['losers',3,2,530,875],['losers',4,1,785,780],
['final',1,1,1200,290]];
const used=new Set();for(const [br,round,index,x,y] of slots){const matching=matches.filter(m=>m.bracket===br&&m.round_number===round).sort((a,b)=>a.match_number-b.match_number);const m=matching[index-1];if(m)used.add(m.id);const el=element('div','node'+(m?'':' future'));el.style.left=x+'px';el.style.top=y+'px';el.append(element('div','heading',(br==='final'?'Grand Final':(br==='winners'?'W':'L')+' R'+round+' Match '+index)+(m?' · Table '+(m.table_number||m.match_number):' · TBD')));for(const pid of [m?.player1_id,m?.player2_id]){const p=players.find(v=>v.id===pid);el.append(element('div','line'+(pid&&m?.winner_id===pid?' won':''),p?.name||(m&&pid===null?'BYE':'TBD')))}canvas.append(el)}
const extra=matches.filter(m=>!used.has(m.id));if(extra.length){const list=element('div','card');list.append(element('h2','','Additional published matches'));for(const m of extra){const p1=players.find(p=>p.id===m.player1_id)?.name||'TBD',p2=players.find(p=>p.id===m.player2_id)?.name||'TBD';list.append(element('p','',m.bracket+' Round '+m.round_number+' · Table '+(m.table_number||m.match_number)+' · '+p1+' vs '+p2))}board.append(list)}

}
load().catch(e=>{$('status').textContent=e.message;$('status').classList.add('error')});
</script></body></html>
